# ID Permanence Configuration
# ----------------------------
# Operation: ENCRYPT or DECRYPT
operation=ENCRYPT

# Secret Key for AES encryption (must be exactly 16 characters for AES-128)
secretKey=MySecretKey12345

# The software product ID / Data Holder Brand ID
softwareProductId=software-product-001

# The ID of the resource to encrypt/decrypt (e.g., account ID, customer ID)
resourceId=account-12345

# The customer/user ID
customerId=customer-001

# Separator used between components before encryption
separator=:
